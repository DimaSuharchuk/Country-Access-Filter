country_access_filter.settings:
  path: '/admin/country-access-filter/settings'
  defaults:
    _form: '\Drupal\country_access_filter\Form\CountryAccessFilterSettingsForm'
    _title: 'Settings'
  requirements:
    _permission: 'administer site configuration'

country_access_filter.form.country.details:
  path: '/ajax/caf/details/{country}'
  defaults:
    _controller: '\Drupal\country_access_filter\Controller\FormController::countryDetailsAjaxCallback'
    _title_callback: '\Drupal\country_access_filter\Controller\FormController::countryDetailsTitle'
  requirements:
    _permission: 'administer site configuration'
country_access_filter.form.country.details.ip.access:
  path: '/ajax/caf/ip/{ip_input}/change-access/{access}'
  defaults:
    _controller: '\Drupal\country_access_filter\Controller\FormController::ipChangeAccessAjaxCallback'
    _title: 'Set access for IP (0 - denied, 1 - allowed)'
  requirements:
    _permission: 'administer site configuration'
    _csrf_token: 'TRUE'
country_access_filter.form.country.details.ip.remove:
  path: '/ajax/caf/ip/{ip_input}/remove'
  defaults:
    _controller: '\Drupal\country_access_filter\Controller\FormController::ipRemoveAjaxCallback'
    _title: 'Remove IP from DB'
  requirements:
    _permission: 'administer site configuration'
    _csrf_token: 'TRUE'
country_access_filter.form.country.details.ip.info:
  path: '/admin/country-access-filter/ip/{ip_input}/info'
  defaults:
    _controller: '\Drupal\country_access_filter\Controller\FormController::ipInfoCallback'
    _title: 'IP info'
  requirements:
    _permission: 'administer site configuration'
