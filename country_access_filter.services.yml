services:
  country_access_filter.config_subscriber:
    class: Drupal\country_access_filter\EventSubscriber\ConfigSubscriber
    arguments:
      - '@country_access_filter.country_service'
    tags:
      - { name: event_subscriber }

  country_access_filter.event_subscriber:
    class: Drupal\country_access_filter\EventSubscriber\Subscriber
    arguments:
      - '@request_stack'
      - '@config.factory'
      - '@current_user'
      - '@country_access_filter.country_service'
    tags:
      - { name: event_subscriber }

  country_access_filter.not_found_subscriber:
    class: Drupal\country_access_filter\EventSubscriber\NotFoundSubscriber
    arguments:
      - '@config.factory'
      - '@database'
      - '@request_stack'
      - '@logger.factory'
      - '@country_access_filter.ip_storage'
      - '@country_access_filter.tracker_404_storage'
    tags:
      - { name: event_subscriber }

  country_access_filter.country_service:
    class: Drupal\country_access_filter\Service\CountryService
    arguments:
      - '@country_access_filter.ip_storage'
      - '@http_client'
      - '@serialization.json'
      - '@config.factory'
      - '@country_manager'
      - '@logger.channel.country_access_filter'

  country_access_filter.ip_storage:
    class: Drupal\country_access_filter\Service\storage\IpStorage
    arguments:
      - '@database'

  country_access_filter.tracker_404_storage:
    class: Drupal\country_access_filter\Service\storage\Tracker404Storage
    arguments:
      - '@database'

  logger.channel.country_access_filter:
    parent: logger.channel_base
    arguments: ['country_access_filter']
